name: Release

# Ein Tag wie v0.1.0 baut auf echten Linux-, Windows- und macOS-Rechnern,
# hängt die Pakete samt SHA256SUMS an ein GitHub-Release, und die Installer laden sie von dort.
# Veröffentlicht wird nur, wenn vorher die komplette CI für genau diesen Stand grün ist.
on:
  push:
    tags: ["v*"]

# Schreibrechte bekommt allein der Job, der das Release anlegt.
permissions:
  contents: read

jobs:
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Paket ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, name: linux-aarch64, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest, name: linux-armv7, target: armv7-unknown-linux-gnueabihf }
          - { os: windows-latest, name: windows-x86_64, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, name: macos-universal, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Version aus dem Tag
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          grep -q "^version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || { echo "Tag passt nicht zu Cargo.toml"; exit 1; }

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: Bauen (Linux, glibc 2.28)
        if: runner.os == 'Linux'
        run: |
          pip install cargo-zigbuild==0.23.4 ziglang==0.14.1
          cargo zigbuild --release --locked --target ${{ matrix.target }}.2.28
          echo "BIN=target/${{ matrix.target }}/release/klangwerk-dj" >> "$GITHUB_ENV"

      - name: Bauen (Windows, statische C-Laufzeit, Control Flow Guard)
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUSTFLAGS: -C control-flow-guard -C target-feature=+crt-static
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc
          echo "BIN=target/x86_64-pc-windows-msvc/release/klangwerk-dj.exe" >> "$GITHUB_ENV"

      - name: Bauen (macOS universal, ab macOS 11)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/klangwerk-dj \
            target/aarch64-apple-darwin/release/klangwerk-dj \
            target/x86_64-apple-darwin/release/klangwerk-dj
          codesign --force --sign - target/universal/klangwerk-dj
          echo "BIN=target/universal/klangwerk-dj" >> "$GITHUB_ENV"

      - name: Verpacken
        shell: bash
        run: |
          dir="klangwerk-dj-$VERSION-${{ matrix.name }}"
          mkdir "$dir"
          cp "$BIN" README.md LICENSE "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: Release veröffentlichen
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Prüfsummen
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          **Linux / macOS:**
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/main/install.sh | sh
          \`\`\`
          **Windows (PowerShell):**
          \`\`\`
          irm https://raw.githubusercontent.com/${GH_REPO}/main/install.ps1 | iex
          \`\`\`
          Danach: \`klangwerk-dj einrichten\`. Die Pakete sind nicht signiert; Prüfsummen stehen in SHA256SUMS.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "klangwerk-dj $GITHUB_REF_NAME" --notes-file notes.md
