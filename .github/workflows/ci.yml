name: CI

# Läuft bei jedem Push auf einen eigenen Zweig, bei Pull Requests, auf Knopfdruck
# und als Vorbedingung des Release-Workflows (workflow_call).
# Dependabot-Zweige laufen nur über ihren Pull Request, sonst liefe alles doppelt.
on:
  push:
    branches-ignore: ["dependabot/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Ein neuer Push auf denselben Zweig bricht den überholten Lauf ab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fremde Actions sind auf einen Commit festgelegt; Dependabot hält die Angaben aktuell.
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Formatierung
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit-Tests
        run: cargo test --locked
      - name: Release-Build
        run: cargo build --release --locked
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Ende-zu-Ende-Test (Spotify und Claude nachgebildet)
        shell: bash
        run: python -I tests/e2e/run.py "target/release/klangwerk-dj${{ runner.os == 'Windows' && '.exe' || '' }}"

  installer:
    name: Installer-Skripte prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Shell-Skripte
        run: |
          sh -n install.sh
          shellcheck install.sh scripts/build-release.sh
      - name: PowerShell-Skript
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
