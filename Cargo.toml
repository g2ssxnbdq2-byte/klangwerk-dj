[package]
name = "klangwerk-dj"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "KI-gestützte Titelauswahl und Übergangsplanung für Spotify"
repository = "https://github.com/g2ssxnbdq2-byte/klangwerk-dj"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
rand = "0.8"
rpassword = "7"
reqwest ={ version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[profile.release]
lto = "thin"
strip = true
